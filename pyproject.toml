[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dxf-cad-mcp"
version = "0.3.0"
description = "DXF CAD MCP server — let AI agents draw 2D engineering drawings via the MCP protocol (cross-platform, AutoCAD-friendly on macOS)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "xhj-cloud" }]
keywords = ["dxf", "cad", "mcp", "ezdxf", "autocad", "ai-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # mcp 固定 <2：2.x 把 FastMCP 改名 MCPServer，与 v1 客户端生态不兼容
    "mcp>=1.9,<2",
    "ezdxf>=1.4",
    "matplotlib>=3.8",
]

[project.scripts]
dxf-cad-mcp = "server:main"

[tool.setuptools]
py-modules = ["server"]
